# --- Schriftart ---
font_family      JetBrainsMono Nerd Font Bold
font_size        11.0

# --- Fenster & Transparenz ---
window_padding_width 15
background_opacity 0.50

# --- Cursor ---
cursor_shape block
cursor #f05ca0
cursor_text_color #0d111c
cursor_blink_interval 0.5

# --- Farben (Clean Deep Blue & Pink/Purple) ---
background #0d111c
foreground #e0e5f5

# Regular colors (0-7)
color0  #1a2133
color1  #f05ca0
color2  #4fd6be
color3  #f0a85c
color4  #527ee0
color5  #b072d1
color6  #5cb6f0
color7  #e0e5f5

# Bright colors (8-15)
color8  #2b354d
color9  #ff7ab5
color10 #73e6d1
color11 #ffc17a
color12 #7aa2f7
color13 #c88df2
color14 #7bd2ff
color15 #ffffff

# Optional: Schaltet den nervigen Audio-Bell-Ton aus
enable_audio_bell no